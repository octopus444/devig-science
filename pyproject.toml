[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "devig-science"
version = "0.1.0"
description = "Pure-Python devigging of two-way decimal odds into fair probabilities and EV-cleared prices, using a sharp book as the reference line."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["odds", "devig", "vig", "overround", "probability", "expected-value", "betting"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Intended Audience :: Developers",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
py-modules = ["devig"]

[tool.pytest.ini_options]
testpaths = ["tests"]
